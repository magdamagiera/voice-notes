<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Voice Notes</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --navy: #1B3A5C; --teal: #2E7D96; --sky: #4BB3C8;
  --gold: #F0A500; --red: #E05C3A; --green: #16a34a;
  --bg: #F7F9FB; --panel: #FFFFFF; --border: #E2EAF4;
  --text: #1E293B; --muted: #64748B; --accent: #2E7D96;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100dvh; display: flex; flex-direction: column;
  max-width: 430px; margin: 0 auto;
}

/* TOP BAR */
.topbar {
  background: var(--navy);
  padding: 54px 20px 16px;
  display: flex; align-items: flex-end; justify-content: space-between;
}
.topbar-title { font-size: 22px; font-weight: 700; color: #fff; }
.topbar-sub { font-size: 13px; color: rgba(255,255,255,.55); margin-top: 2px; }
.topbar-badge {
  background: var(--gold); color: var(--navy);
  font-size: 11px; font-weight: 700;
  padding: 4px 10px; border-radius: 20px;
}

/* TABS */
.tabs {
  display: flex; background: var(--navy);
  padding: 0 20px; gap: 4px;
}
.tab {
  flex: 1; padding: 10px 0; font-size: 14px; font-weight: 600;
  color: rgba(255,255,255,.45); border: none; background: none;
  border-bottom: 2.5px solid transparent; cursor: pointer;
  transition: color .15s, border-color .15s;
}
.tab.on { color: #fff; border-bottom-color: var(--gold); }

/* SCREENS */
.screen { display: none; flex: 1; flex-direction: column; padding: 20px 16px; overflow-y: auto; }
.screen.on { display: flex; }

/* RECORD */
.rec-center { display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
.timer { font-size: 52px; font-weight: 300; font-variant-numeric: tabular-nums; color: var(--text); letter-spacing: 2px; }
.rec-label { font-size: 14px; color: var(--muted); margin: 8px 0 28px; min-height: 20px; }

.mic-wrap { position: relative; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
.pulse { position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--red); opacity: 0; }
.recording .pulse { animation: pulse 1.1s ease-out infinite; }
@keyframes pulse { 0%{transform:scale(1);opacity:.6} 100%{transform:scale(1.45);opacity:0} }

.mic-btn {
  width: 80px; height: 80px; border-radius: 50%;
  background: var(--panel); border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; cursor: pointer; transition: background .15s, transform .1s;
  box-shadow: 0 4px 16px rgba(0,0,0,.08);
  position: relative; z-index: 1;
}
.mic-btn:active { transform: scale(.93); }
.mic-btn.recording { background: #FEE2E2; border-color: #FCA5A5; }
.mic-btn svg { pointer-events: none; }

.hint { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; margin-top: 10px; }

/* TRANSCRIPT CARD */
.card {
  background: var(--panel); border-radius: 16px;
  border: 1px solid var(--border); padding: 16px; margin-top: 20px;
}
.card-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin-bottom: 10px; }
.transcript { width: 100%; border: none; background: none; font-size: 15px; color: var(--text); line-height: 1.65; resize: none; font-family: inherit; outline: none; min-height: 80px; }
.divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
.tag-person { background: #EBF4F8; color: var(--navy); }
.tag-folder { background: #E8F5E9; color: #166534; }
.tag-file { font-size: 11px; color: var(--muted); font-family: 'SF Mono', monospace; }

.actions { display: flex; gap: 10px; margin-top: 14px; }
.btn {
  flex: 1; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 600;
  border: none; cursor: pointer; transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(.97); opacity: .85; }
.btn-primary { background: var(--navy); color: #fff; }
.btn-danger { background: #FEE2E2; color: var(--red); flex: 0 0 auto; padding: 13px 18px; }
.btn:disabled { opacity: .35; cursor: default; }

/* NOTES */
.search-wrap { position: relative; margin-bottom: 14px; }
.search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search { width: 100%; padding: 11px 12px 11px 38px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); font-size: 15px; color: var(--text); outline: none; }
.search:focus { border-color: var(--accent); }

.folder { background: var(--panel); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; }
.folder-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; }
.folder-icon { font-size: 22px; }
.folder-name { font-size: 15px; font-weight: 600; color: var(--text); flex: 1; }
.folder-count { font-size: 13px; color: var(--muted); }
.folder-chev { color: var(--muted); font-size: 18px; transition: transform .2s; }
.folder-chev.open { transform: rotate(180deg); }
.folder-notes { border-top: 1px solid var(--border); display: none; }
.folder-notes.open { display: block; }

.note-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
.note-row:last-child { border-bottom: none; }
.note-row:active { background: var(--bg); }
.note-info { flex: 1; min-width: 0; }
.note-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-preview { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-time { font-size: 11px; color: var(--muted); flex-shrink: 0; margin-top: 2px; }
.note-del { padding: 6px; color: var(--muted); font-size: 18px; cursor: pointer; flex-shrink: 0; border: none; background: none; }
.note-del:active { color: var(--red); }

.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 10px; }
.empty svg { opacity: .25; }
.empty p { font-size: 15px; color: var(--muted); text-align: center; line-height: 1.5; }

/* DETAIL */
.back { display: flex; align-items: center; gap: 4px; color: var(--accent); font-size: 16px; font-weight: 500; border: none; background: none; cursor: pointer; padding: 0 0 16px; }
.detail-card { background: var(--panel); border-radius: 16px; border: 1px solid var(--border); padding: 18px; flex: 1; display: flex; flex-direction: column; }
.detail-title { font-size: 16px; font-weight: 700; color: var(--text); font-family: 'SF Mono', monospace; }
.detail-meta { font-size: 12px; color: var(--muted); margin: 4px 0 14px; }
.detail-body { flex: 1; width: 100%; border: none; background: none; font-size: 15px; color: var(--text); line-height: 1.7; resize: none; font-family: inherit; outline: none; min-height: 120px; }
.detail-actions { display: flex; gap: 8px; margin-top: 14px; }
.btn-outline { flex: 1; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border); background: none; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; }
.btn-filled { flex: 1; padding: 12px; border-radius: 12px; border: none; background: var(--navy); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-outline:active, .btn-filled:active { opacity: .8; transform: scale(.97); }

/* TOAST */
.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--navy); color: #fff; border-radius: 20px;
  padding: 11px 22px; font-size: 14px; font-weight: 500;
  opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 999;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* WAVEFORM */
.waveform { display: flex; align-items: center; justify-content: center; gap: 3px; height: 28px; margin-bottom: 4px; }
.wave-bar { width: 3px; border-radius: 2px; background: var(--red); opacity: 0; }
.recording .wave-bar { opacity: 1; animation: wave 0.8s ease-in-out infinite; }
.wave-bar:nth-child(1){animation-delay:0s;height:8px}
.wave-bar:nth-child(2){animation-delay:.1s;height:16px}
.wave-bar:nth-child(3){animation-delay:.2s;height:24px}
.wave-bar:nth-child(4){animation-delay:.3s;height:18px}
.wave-bar:nth-child(5){animation-delay:.4s;height:12px}
.wave-bar:nth-child(6){animation-delay:.3s;height:20px}
.wave-bar:nth-child(7){animation-delay:.2s;height:14px}
.wave-bar:nth-child(8){animation-delay:.1s;height:8px}
@keyframes wave { 0%,100%{transform:scaleY(.5)} 50%{transform:scaleY(1)} }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">🎙 Voice Notes</div>
    <div class="topbar-sub" id="stats">0 folderów · 0 notatek</div>
  </div>
  <div class="topbar-badge">BETA</div>
</div>

<div class="tabs">
  <button class="tab on" onclick="tab('record')" id="tab-record">⬤ Nagraj</button>
  <button class="tab" onclick="tab('notes')" id="tab-notes">🗂 Notatki</button>
</div>

<!-- RECORD -->
<div class="screen on" id="s-record">
  <div class="rec-center">
    <div class="timer" id="timer">0:00</div>
    <div class="rec-label" id="rec-label">Naciśnij aby nagrać</div>

    <div class="waveform" id="waveform">
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
    </div>

    <div class="mic-wrap" id="mic-wrap">
      <div class="pulse"></div>
      <button class="mic-btn" id="mic-btn" onclick="toggleRec()" aria-label="Nagraj">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/>
        </svg>
      </button>
    </div>
    <div class="hint" id="hint">Zacznij od imienia osoby lub działu<br><b>np. "Anna Kowalska wyniki sprzedaży…"</b></div>
  </div>

  <div id="transcript-section" style="display:none">
    <div class="card">
      <div class="card-label">Transkrypcja — popraw jeśli potrzeba</div>
      <textarea class="transcript" id="transcript" rows="5" placeholder="Transkrypcja..."></textarea>
      <hr class="divider">
      <div class="tag-row" id="tag-row">
        <span class="tag tag-person" id="t-person"></span>
        <span class="tag tag-folder" id="t-folder">📁 —</span>
        <span class="tag-file" id="t-file"></span>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-danger" onclick="discard()">🗑</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveNote()">💾 Zapisz notatkę</button>
    </div>
  </div>
</div>

<!-- NOTES -->
<div class="screen" id="s-notes">
  <div class="search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input class="search" type="search" placeholder="Szukaj notatek i folderów…" oninput="renderNotes(this.value)" id="search-input">
  </div>
  <div id="folder-list"></div>
</div>

<!-- DETAIL -->
<div class="screen" id="s-detail">
  <button class="back" onclick="closeDetail()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    Notatki
  </button>
  <div class="detail-card">
    <div class="detail-title" id="d-title"></div>
    <div class="detail-meta" id="d-meta"></div>
    <hr class="divider">
    <textarea class="detail-body" id="d-body" rows="10"></textarea>
    <hr class="divider">
    <div class="tag-row">
      <span class="tag tag-person" id="d-person"></span>
      <span class="tag tag-folder" id="d-folder"></span>
      <span class="tag-file" id="d-file"></span>
    </div>
  </div>
  <div class="detail-actions" style="margin-top:14px">
    <button class="btn-outline" onclick="copyNote()">📋 Kopiuj</button>
    <button class="btn-filled" onclick="downloadNote()">⬇️ Pobierz .txt</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let notes = JSON.parse(localStorage.getItem('vn_notes') || '[]');
let rec = false, timerInt = null, secs = 0;
let mediaRec = null, chunks = [], activeNote = null;
let recognition = null;

function save() { localStorage.setItem('vn_notes', JSON.stringify(notes)); updateStats(); }

function tab(name) {
  ['record','notes'].forEach(t => {
    document.getElementById('s-'+t).classList.toggle('on', t===name);
    document.getElementById('tab-'+t).classList.toggle('on', t===name);
  });
  if(name==='notes') renderNotes();
}

function pad(n){ return String(n).padStart(2,'0'); }

function startTimer() {
  secs = 0;
  timerInt = setInterval(()=>{
    secs++;
    const m = Math.floor(secs/60), s = secs%60;
    document.getElementById('timer').textContent = m+':'+pad(s);
  }, 1000);
}

function stopTimer() { clearInterval(timerInt); }

async function toggleRec() {
  if(!rec) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true, sampleRate:16000});
      chunks = [];
      mediaRec = new MediaRecorder(stream);
      mediaRec.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
      mediaRec.onstop = () => { stream.getTracks().forEach(t=>t.stop()); processAudio(); };
      mediaRec.start(100);

      // Web Speech API jeśli dostępne
      if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SR();
        recognition.lang = 'pl-PL';
        recognition.continuous = true;
        recognition.interimResults = true;
        let finalText = '';
        recognition.onresult = e => {
          let interim = '';
          for(let i = e.resultIndex; i < e.results.length; i++) {
            if(e.results[i].isFinal) finalText += e.results[i][0].transcript + ' ';
            else interim += e.results[i][0].transcript;
          }
          document.getElementById('transcript').value = (finalText + interim).trim();
          updateTags(document.getElementById('transcript').value);
        };
        recognition.start();
      }

      rec = true;
      startTimer();
      document.getElementById('mic-btn').classList.add('recording');
      document.getElementById('mic-wrap').classList.add('recording');
      document.getElementById('waveform').classList.add('recording');
      document.getElementById('rec-label').textContent = 'Nagrywanie… naciśnij aby zakończyć';
      document.getElementById('hint').textContent = '';
      document.getElementById('transcript-section').style.display = 'none';
    } catch(e) {
      toast('Brak dostępu do mikrofonu – sprawdź uprawnienia w Safari > Ustawienia');
    }
  } else {
    rec = false;
    stopTimer();
    if(recognition) { recognition.stop(); recognition = null; }
    document.getElementById('mic-btn').classList.remove('recording');
    document.getElementById('mic-wrap').classList.remove('recording');
    document.getElementById('waveform').classList.remove('recording');
    document.getElementById('rec-label').textContent = 'Przetwarzanie…';
    if(mediaRec && mediaRec.state !== 'inactive') mediaRec.stop();
  }
}

function processAudio() {
  document.getElementById('rec-label').textContent = 'Gotowe — sprawdź transkrypcję';
  document.getElementById('transcript-section').style.display = 'block';
  document.getElementById('hint').textContent = 'Popraw tekst jeśli potrzeba, potem zapisz';
  const current = document.getElementById('transcript').value.trim();
  if(!current) {
    document.getElementById('transcript').value = '[Transkrypcja niedostępna — wpisz tekst ręcznie]';
  }
  updateTags(document.getElementById('transcript').value);
}

document.getElementById('transcript').addEventListener('input', function(){ updateTags(this.value); });

function words(text) { return text.trim().split(/\s+/).filter(w=>w); }

function toFilename(ws) {
  return ws.slice(0,5).join('_')
    .replace(/[^\wąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g,'_')
    .replace(/_+/g,'_').replace(/^_|_$/g,'') + '.txt';
}

function updateTags(text) {
  const ws = words(text);
  if(ws.length < 2) return;
  const folder = ws.slice(0,2).join(' ');
  const filename = toFilename(ws);
  const person = ws.slice(0,2).join(' ');
  document.getElementById('t-person').textContent = '👤 ' + person;
  document.getElementById('t-folder').textContent = '📁 ' + folder;
  document.getElementById('t-file').textContent = filename;
}

function saveNote() {
  const text = document.getElementById('transcript').value.trim();
  if(!text || text.startsWith('[')) { toast('Wpisz treść notatki'); return; }
  const ws = words(text);
  if(ws.length < 2) { toast('Notatka musi zawierać min. 2 słowa'); return; }
  const folder = ws.slice(0,2).join(' ');
  const filename = toFilename(ws);
  const person = ws.slice(0,2).join(' ');
  const note = { id: Date.now(), text, folder, filename, person, created: new Date().toISOString() };
  notes.unshift(note);
  save();
  toast('✅ Zapisano w folderze "' + folder + '"');
  discard();
  setTimeout(()=>tab('notes'), 600);
}

function discard() {
  document.getElementById('transcript-section').style.display = 'none';
  document.getElementById('transcript').value = '';
  document.getElementById('timer').textContent = '0:00';
  document.getElementById('rec-label').textContent = 'Naciśnij aby nagrać';
  document.getElementById('hint').innerHTML = 'Zacznij od imienia osoby lub działu<br><b>np. "Anna Kowalska wyniki sprzedaży…"</b>';
  secs = 0;
}

function renderNotes(q) {
  const el = document.getElementById('folder-list');
  let list = notes;
  if(q) list = notes.filter(n => (n.text+n.folder+n.filename).toLowerCase().includes(q.toLowerCase()));
  if(!list.length) {
    el.innerHTML = `<div class="empty">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10,9 9,9 8,9"/></svg>
      <p>${notes.length ? 'Brak wyników dla tego wyszukiwania' : 'Brak notatek\nNagraj pierwszą notatkę głosową'}</p>
    </div>`;
    return;
  }
  const folders = {};
  list.forEach(n => { if(!folders[n.folder]) folders[n.folder]=[]; folders[n.folder].push(n); });
  el.innerHTML = Object.keys(folders).map(f => {
    const ns = folders[f];
    const fid = 'f' + btoa(unescape(encodeURIComponent(f))).replace(/[^a-z0-9]/gi,'');
    return `<div class="folder">
      <div class="folder-head" onclick="toggleFolder('${fid}')">
        <span class="folder-icon">📁</span>
        <span class="folder-name">${f}</span>
        <span class="folder-count">${ns.length}</span>
        <svg class="folder-chev open" id="chev-${fid}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6,9 12,15 18,9"/></svg>
      </div>
      <div class="folder-notes open" id="${fid}">
        ${ns.map(n => noteRow(n)).join('')}
      </div>
    </div>`;
  }).join('');
}

function noteRow(n) {
  const d = new Date(n.created);
  const ts = d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
  const prev = n.text.slice(0,55) + (n.text.length>55?'…':'');
  return `<div class="note-row" onclick="openDetail(${n.id})">
    <div class="note-info">
      <div class="note-name">📄 ${n.filename}</div>
      <div class="note-preview">${prev}</div>
    </div>
    <span class="note-time">${ts}</span>
    <button class="note-del" onclick="delNote(event,${n.id})" aria-label="Usuń">✕</button>
  </div>`;
}

function toggleFolder(id) {
  const fn = document.getElementById(id);
  const ch = document.getElementById('chev-'+id);
  fn.classList.toggle('open');
  if(ch) ch.classList.toggle('open');
}

function openDetail(id) {
  const n = notes.find(n=>n.id===id);
  if(!n) return;
  activeNote = n;
  document.getElementById('d-title').textContent = n.filename;
  const d = new Date(n.created);
  document.getElementById('d-meta').textContent = d.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) + ' · ' + d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('d-body').value = n.text;
  document.getElementById('d-person').textContent = '👤 ' + n.person;
  document.getElementById('d-folder').textContent = '📁 ' + n.folder;
  document.getElementById('d-file').textContent = n.filename;
  ['s-notes','s-record'].forEach(s=>document.getElementById(s).classList.remove('on'));
  document.getElementById('s-detail').classList.add('on');
}

function closeDetail() {
  if(activeNote) {
    activeNote.text = document.getElementById('d-body').value.trim();
    save();
  }
  document.getElementById('s-detail').classList.remove('on');
  document.getElementById('s-notes').classList.add('on');
  renderNotes();
}

function delNote(e, id) {
  e.stopPropagation();
  if(!confirm('Usunąć tę notatkę?')) return;
  notes = notes.filter(n=>n.id!==id);
  save(); renderNotes();
  toast('Notatka usunięta');
}

function copyNote() {
  navigator.clipboard.writeText(document.getElementById('d-body').value)
    .then(()=>toast('📋 Skopiowano do schowka'))
    .catch(()=>toast('Zaznacz tekst i kopiuj ręcznie'));
}

function downloadNote() {
  if(!activeNote) return;
  const blob = new Blob([activeNote.text], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = activeNote.filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  toast('⬇️ Pobieranie: ' + activeNote.filename);
}

function updateStats() {
  const f = new Set(notes.map(n=>n.folder)).size;
  document.getElementById('stats').textContent = f + ' ' + (f===1?'folder':'folderów') + ' · ' + notes.length + ' ' + (notes.length===1?'notatka':'notatek');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

updateStats();
</script>
</body>
</html>
